<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据浏览</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="/static/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand" href="/dashboard/"><i class="bi bi-activity me-2"></i>Crawler</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/dashboard/">仪表盘</a>
            <a class="nav-link" href="/dashboard/tasks.html">任务</a>
            <a class="nav-link active" href="/dashboard/data.html">数据</a>
            <a class="nav-link" href="/dashboard/logs.html">日志</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4 py-4 page-content">
    <h4 class="mb-4 fw-bold">数据浏览</h4>

    <!-- 选择表和视图 -->
    <div class="row g-3 mb-3">
        <div class="col-md-4">
            <label class="form-label small">业务表</label>
            <select class="form-select" id="tableSelect" onchange="onTableChange()"><option value="">请选择...</option></select>
        </div>
        <div class="col-md-3">
            <label class="form-label small">视图模式</label>
            <div class="btn-group w-100" role="group">
                <input type="radio" class="btn-check" name="viewMode" id="viewTable" value="table" checked onchange="onViewChange()">
                <label class="btn btn-outline-secondary" for="viewTable"><i class="bi bi-table me-1"></i>表格</label>
                <input type="radio" class="btn-check" name="viewMode" id="viewChart" value="chart" onchange="onViewChange()">
                <label class="btn btn-outline-secondary" for="viewChart"><i class="bi bi-bar-chart-fill me-1"></i>图表</label>
            </div>
        </div>
    </div>

    <!-- 表格视图 -->
    <div id="tableView">
        <!-- 筛选栏 -->
        <div class="card mb-3">
            <div class="card-body">
                <div class="row g-2">
                    <div class="col-md-3"><label class="form-label small">返回字段</label><input class="form-control" id="qFields" placeholder="留空=全部，例: steam_id,peak_players"></div>
                    <div class="col-md-3"><label class="form-label small">排序</label><input class="form-control" id="qOrder" placeholder="例: peak_players DESC"></div>
                    <div class="col-md-3"><label class="form-label small">筛选 (JSON)</label><input class="form-control" id="qWhere" placeholder="[{"col":"steam_id","op":"=","value":1}]" title="格式: [{"col":"字段","op":"运算符","value":值}] 运算符: = != > < >= <= IN NOT IN LIKE BETWEEN IS NULL"></div>
                    <div class="col-md-1"><label class="form-label small">每页</label><select class="form-select" id="qLimit"><option value="20">20</option><option value="50" selected>50</option><option value="100">100</option></select></div>
                </div>
                <div class="mt-2">
                    <button class="btn btn-primary" onclick="loadData()"><i class="bi bi-search me-1"></i>查询</button>
                    <button class="btn btn-outline-success ms-2" onclick="showBatchInsertModal()" id="batchInsertBtn" disabled title="批量插入数据"><i class="bi bi-plus-square me-1"></i>批量插入</button>
                    <button class="btn btn-outline-danger ms-2" onclick="truncateTable()" id="truncateBtn" disabled title="清空当前表所有数据"><i class="bi bi-exclamation-triangle me-1"></i>清空数据</button>
                </div>
            </div>
        </div>
        <!-- 数据表格 -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="dataTable"><thead id="dataThead"></thead><tbody id="dataTbody"><tr><td colspan="10" class="text-muted text-center">请选择业务表</td></tr></tbody></table>
                </div>
                <nav class="mt-3"><ul class="pagination justify-content-center mb-0" id="dataPagination"></ul></nav>
            </div>
        </div>
    </div>

    <!-- 图表视图 -->
    <div id="chartView" style="display:none;">
        <div class="card mb-3">
            <div class="card-body">
                <div class="row g-2 align-items-end">
                    <div class="col-md-2"><label class="form-label small">X 轴字段</label><select class="form-select" id="chXCol"><option value="">请选择...</option></select></div>
                    <div class="col-md-2"><label class="form-label small">Y 轴字段</label><select class="form-select" id="chYCol"><option value="">请选择...</option></select></div>
                    <div class="col-md-2"><label class="form-label small">图例字段（可选）</label><select class="form-select" id="chSeriesCol"><option value="">无（单线）</option></select></div>
                    <div class="col-md-2"><label class="form-label small">排序</label><input class="form-control" id="chOrder" placeholder="例: stat_ts ASC"></div>
                    <div class="col-md-2"><label class="form-label small">筛选 (JSON)</label><input class="form-control" id="chWhere" placeholder='[{"col":"steam_id","op":"=","value":1}]'></div>
                    <div class="col-md-2 pt-md-4"><button class="btn btn-primary w-100" onclick="loadChart()"><i class="bi bi-bar-chart-line-fill me-1"></i>绘制图表</button></div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-body">
                <div id="dataChart" class="chart-container"></div>
            </div>
        </div>
    </div>
</div>

<!-- 编辑行弹窗 -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title"><i class="bi bi-pencil-square me-2"></i>编辑数据行</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-2"><small class="text-muted">使用列 <code id="editIdCol"></code> = <code id="editIdVal"></code> 定位</small></div>
                <div id="editFields"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveEdit()" id="saveEditBtn"><i class="bi bi-check-lg"></i> 保存</button>
            </div>
        </div>
    </div>
</div>

<!-- 批量插入弹窗 -->
<div class="modal fade" id="batchModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title"><i class="bi bi-plus-square me-2"></i>批量插入数据</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <div class="mb-2"><small class="text-muted">目标表：<code id="batchTableName"></code> &nbsp; 每行一个 JSON 对象，支持 UPSERT</small></div>
                <textarea class="form-control font-monospace" id="batchJson" rows="12" placeholder='[&#10;  {"col1": "value1", "col2": 123},&#10;  {"col1": "value2", "col2": 456}&#10;]'></textarea>
                <div class="form-text mt-1">格式：JSON 数组，每个元素是一个与表列匹配的对象。使用 ON CONFLICT DO UPDATE（UPSERT）。</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" onclick="doBatchInsert()" id="batchBtn"><i class="bi bi-cloud-upload"></i> 提交</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast" role="alert"><div class="toast-body" id="toastMsg"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1/dist/apexcharts.min.js"></script>
<script src="/static/js/api.js?v=3"></script>
<script src="/static/js/charts.js"></script>
<script>
let currentTable = '', currentPage = 0, chartInstance = null;
let editModal = null, batchModal = null;
let _colCache = null;   // column info cache for current table
let _currentRows = [];   // current page row data for edit without JSON-inlining

document.addEventListener('DOMContentLoaded', () => {
    editModal = new bootstrap.Modal('#editModal');
    batchModal = new bootstrap.Modal('#batchModal');
});

(async () => {
    try {
        const res = await apiGet('/data/tables');
        const sel = document.getElementById('tableSelect');
        res.data.forEach(t => { const o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o); });
    } catch(e) { console.error(e); }
})();

function onTableChange() {
    currentTable = document.getElementById('tableSelect').value;
    currentPage = 0;
    document.getElementById('batchInsertBtn').disabled = !currentTable;
    document.getElementById('truncateBtn').disabled = !currentTable;
    _colCache = null;
    if (currentTable) loadData();
}

function onViewChange() {
    const mode = document.querySelector('input[name="viewMode"]:checked').value;
    document.getElementById('tableView').style.display = mode === 'table' ? '' : 'none';
    document.getElementById('chartView').style.display = mode === 'chart' ? '' : 'none';
    if (mode === 'chart' && currentTable) loadColumns();
}

async function getColumns() {
    if (_colCache) return _colCache;
    if (!currentTable) return [];
    try {
        const res = await apiGet(`/data/${currentTable}/columns`);
        _colCache = res.data;
        return res.data;
    } catch(e) { toast(e.message, 'danger'); return []; }
}

async function loadColumns() {
    if (!currentTable) return;
    const cols = await getColumns();
    const xSel = document.getElementById('chXCol'), ySel = document.getElementById('chYCol'), sSel = document.getElementById('chSeriesCol');
    const xVal = xSel.value, yVal = ySel.value, sVal = sSel.value;
    const numericCols = cols.filter(c => ['INTEGER','REAL','FLOAT','DOUBLE','NUMERIC'].includes((c.type||'').toUpperCase()) || c.name.endsWith('_id'));
    const allOpts = cols.map(c => `<option value="${esc(c.name)}">${esc(c.name)} (${c.type||'TEXT'})</option>`).join('');
    const numOpts = numericCols.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
    xSel.innerHTML = '<option value="">请选择...</option>' + allOpts;
    ySel.innerHTML = '<option value="">请选择...</option>' + numOpts;
    sSel.innerHTML = '<option value="">无（单线）</option>' + allOpts;
    if (xVal && cols.some(c => c.name === xVal)) xSel.value = xVal;
    if (yVal && numericCols.some(c => c.name === yVal)) ySel.value = yVal;
    if (sVal && cols.some(c => c.name === sVal)) sSel.value = sVal;
}

async function loadData(page = 0) {
    currentPage = page;
    if (!currentTable) return;
    const params = { limit: parseInt(document.getElementById('qLimit').value), offset: page * parseInt(document.getElementById('qLimit').value) };
    const fields = document.getElementById('qFields').value.trim();
    if (fields) params.fields = fields;
    const order = document.getElementById('qOrder').value.trim();
    if (order) params.order_by = order;
    const where = document.getElementById('qWhere').value.trim();
    if (where) params.where = where;

    try {
        const res = await apiGet(`/data/${currentTable}/query`, params);
        renderDataTable(res.data, res.total, params.limit, page);
        renderPagination(res.total, params.limit, page, 'dataPagination', loadData);
    } catch(e) {
        document.getElementById('dataTbody').innerHTML = `<tr><td colspan="10" class="text-danger text-center">${esc(e.message)}</td></tr>`;
    }
}

function renderDataTable(data, total, limit, page) {
    const thead = document.getElementById('dataThead'), tbody = document.getElementById('dataTbody');
    _currentRows = data;  // cache for edit
    if (data.length === 0) {
        thead.innerHTML = ''; tbody.innerHTML = '<tr><td class="text-muted text-center">无数据</td></tr>';
        return;
    }
    const keys = Object.keys(data[0]);
    thead.innerHTML = '<tr>' + keys.map(k => `<th>${esc(k)}</th>`).join('') + '<th style="width:90px">操作</th></tr>';
    tbody.innerHTML = data.map((row, idx) => '<tr>' +
        keys.map(k => `<td class="small">${esc(String(row[k] ?? ''))}</td>`).join('') +
        `<td class="text-nowrap"><button class="btn btn-sm btn-outline-secondary edit-row-btn me-1" data-row-idx="${idx}" title="编辑此行"><i class="bi bi-pencil"></i></button><button class="btn btn-sm btn-outline-danger delete-row-btn" data-row-idx="${idx}" title="删除此行"><i class="bi bi-trash"></i></button></td>` +
        '</tr>').join('');
    // Attach click handlers after render (avoids JSON-inlining issues)
    tbody.querySelectorAll('.edit-row-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.rowIdx);
            showEditModal(_currentRows[idx]);
        });
    });
    tbody.querySelectorAll('.delete-row-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.rowIdx);
            deleteRow(_currentRows[idx]);
        });
    });
}

function renderPagination(total, limit, page, containerId, fn) {
    const pages = Math.ceil(total / limit);
    const ul = document.getElementById(containerId);
    if (pages <= 1) { ul.innerHTML = ''; return; }
    let html = '';
    for (let i = 0; i < pages; i++) {
        html += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" href="#" onclick="${fn.name}(${i});return false">${i + 1}</a></li>`;
    }
    ul.innerHTML = html;
}

// ================================================================
// 编辑行
// ================================================================
function showEditModal(rowData) {
    const cols = _colCache || [];
    // Use 'id' as default id column if available, else first column
    const idCol = cols.find(c => c.name === 'id') ? 'id' : (Object.keys(rowData)[0] || 'id');
    const idVal = rowData[idCol] ?? '';

    document.getElementById('editIdCol').textContent = idCol;
    document.getElementById('editIdVal').textContent = idVal;

    const container = document.getElementById('editFields');
    const editableKeys = Object.keys(rowData).filter(k => k !== idCol);

    container.innerHTML = editableKeys.map(k => {
        const isNum = cols.some(c => c.name === k && ['INTEGER','REAL','FLOAT','DOUBLE','NUMERIC'].includes((c.type||'').toUpperCase()));
        return `<div class="mb-2 row align-items-center">
            <label class="col-sm-3 col-form-label col-form-label-sm text-truncate" title="${esc(k)}">${esc(k)}</label>
            <div class="col-sm-9">
                <input type="${isNum ? 'number' : 'text'}" class="form-control form-control-sm" data-col="${esc(k)}" value="${esc(String(rowData[k] ?? ''))}" ${isNum ? 'step="any"' : ''}>
            </div>
        </div>`;
    }).join('');

    // Store id info for save
    container.dataset.idCol = idCol;
    container.dataset.idVal = idVal;

    editModal.show();
}

async function saveEdit() {
    const container = document.getElementById('editFields');
    const idCol = container.dataset.idCol;
    const idVal = container.dataset.idVal;
    const btn = document.getElementById('saveEditBtn');

    const data = {};
    container.querySelectorAll('input[data-col]').forEach(input => {
        data[input.dataset.col] = input.value;
    });

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> 保存中...';

    try {
        await apiPut(`/data/${currentTable}/rows/${encodeURIComponent(idCol)}/${encodeURIComponent(idVal)}`, { data });
        toast('数据更新成功', 'success');
        editModal.hide();
        loadData(currentPage);
    } catch(e) {
        toast('更新失败: ' + e.message, 'danger');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-check-lg"></i> 保存';
    }
}

async function truncateTable() {
    if (!currentTable) return;
    if (!confirm(`⚠️ 确认清空表 "${currentTable}" 的所有数据？\n此操作不可撤销！请手动输入表名确认:`)) return;
    const confirmName = prompt(`请输入表名 "${currentTable}" 以确认清空操作:`);
    if (confirmName !== currentTable) {
        toast('表名不匹配，已取消操作', 'warning');
        return;
    }
    try {
        const res = await apiDelete(`/data/${currentTable}/rows`);
        toast(res.message, 'success');
        loadData(currentPage);
    } catch(e) {
        toast('清空失败: ' + e.message, 'danger');
    }
}

async function deleteRow(rowData) {
    const cols = _colCache || [];
    const idCol = cols.find(c => c.name === 'id') ? 'id' : (Object.keys(rowData)[0] || 'id');
    const idVal = rowData[idCol] ?? '';

    if (!confirm(`确认删除行？\n${idCol} = ${idVal}\n此操作不可撤销。`)) return;

    try {
        await apiDelete(`/data/${currentTable}/rows/${encodeURIComponent(idCol)}/${encodeURIComponent(idVal)}`);
        toast('数据已删除', 'success');
        loadData(currentPage);
    } catch(e) {
        toast('删除失败: ' + e.message, 'danger');
    }
}

// ================================================================
// 批量插入
// ================================================================
function showBatchInsertModal() {
    if (!currentTable) return;
    document.getElementById('batchTableName').textContent = currentTable;
    document.getElementById('batchJson').value = '';
    batchModal.show();
}

async function doBatchInsert() {
    const btn = document.getElementById('batchBtn');
    const raw = document.getElementById('batchJson').value.trim();
    if (!raw) { toast('请输入 JSON 数据', 'warning'); return; }

    let rows;
    try {
        rows = JSON.parse(raw);
    } catch(e) {
        toast('JSON 格式错误: ' + e.message, 'danger');
        return;
    }
    if (!Array.isArray(rows)) { toast('必须是 JSON 数组', 'warning'); return; }
    if (rows.length === 0) { toast('数组不能为空', 'warning'); return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> 提交中...';

    try {
        const res = await apiPost(`/data/${currentTable}/rows/batch`, { rows });
        toast(res.message, 'success');
        batchModal.hide();
        loadData(currentPage);
    } catch(e) {
        toast('批量插入失败: ' + e.message, 'danger');
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-cloud-upload"></i> 提交';
    }
}

// ================================================================
// 图表
// ================================================================
async function loadChart() {
    if (!currentTable) return;
    const xCol = document.getElementById('chXCol').value;
    const yCol = document.getElementById('chYCol').value;
    const seriesCol = document.getElementById('chSeriesCol').value;
    const orderBy = document.getElementById('chOrder').value.trim();
    const where = document.getElementById('chWhere').value.trim();
    if (!xCol) return alert('请选择 X 轴字段');
    if (!yCol) return alert('请选择 Y 轴字段');

    const params = {};
    if (seriesCol) {
        params.fields = [xCol, yCol, seriesCol].join(',');
        params.order_by = orderBy || xCol + ' ASC';
    } else {
        params.fields = [xCol, yCol].join(',');
        if (orderBy) params.order_by = orderBy;
    }
    if (where) params.where = where;
    params.limit = 500;

    try {
        const res = await apiGet(`/data/${currentTable}/query`, params);
        if (res.data.length === 0) return alert('无数据');

        if (chartInstance) chartInstance.destroy();

        if (seriesCol) {
            const groups = {};
            for (const row of res.data) {
                const key = String(row[seriesCol] ?? 'null');
                if (!groups[key]) groups[key] = { name: key, data: [] };
                groups[key].data.push({ x: row[xCol], y: parseFloat(row[yCol]) || 0 });
            }
            const series = Object.values(groups);
            const anns = series.map((s, i) => {
                const mean = s.data.reduce((sum, d) => sum + d.y, 0) / s.data.length;
                return { y: mean, borderColor: CHART_COLORS[i % CHART_COLORS.length], strokeDashArray: 4, label: { text: `${s.name} 均值: ${mean.toFixed(1)}`, style: { color: '#fff', background: CHART_COLORS[i % CHART_COLORS.length] } } };
            });
            chartInstance = lineChart(document.querySelector('#dataChart'), {
                chart: { height: 750 },
                series: series,
                xaxis: { type: (typeof res.data[0][xCol]) === 'number' ? 'numeric' : 'category', labels: { rotate: -45 } },
                stroke: { width: 2, curve: 'smooth' },
                legend: { position: 'top' },
                tooltip: { shared: true, intersect: false },
                annotations: { yaxis: anns },
            });
        } else {
            const dataArr = res.data.map(r => ({ x: r[xCol], y: parseFloat(r[yCol]) || 0 }));
            const mean = dataArr.reduce((sum, d) => sum + d.y, 0) / dataArr.length;
            chartInstance = lineChart(document.querySelector('#dataChart'), {
                chart: { height: 750 },
                series: [{ name: yCol, data: dataArr }],
                xaxis: { type: (typeof res.data[0][xCol]) === 'number' ? 'numeric' : 'category', labels: { rotate: -45 } },
                stroke: { width: 2, curve: 'smooth' },
                legend: { position: 'top' },
                tooltip: { shared: true, intersect: false },
                annotations: { yaxis: [{ y: mean, borderColor: CHART_COLORS[0], strokeDashArray: 4, label: { text: `${yCol} 均值: ${mean.toFixed(1)}`, style: { color: '#fff', background: CHART_COLORS[0] } } }] },
            });
        }
        chartInstance.render();
    } catch(e) { alert('绘图失败: ' + e.message); }
}

// ================================================================
// 工具函数
// ================================================================
function toast(msg, type) {
    const el = document.getElementById('toastMsg');
    el.textContent = msg; el.className = `toast-body text-${type}`;
    new bootstrap.Toast('#liveToast').show();
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
