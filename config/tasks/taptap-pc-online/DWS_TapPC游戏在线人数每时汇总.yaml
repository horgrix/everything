name: "DWS_TapPC游戏在线人数每时汇总"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT 
      crawled_at,
      COUNT(*) AS game_cnt, 
      SUM(online_players) AS online_players,
      SUM(CASE WHEN distribution_type = 0 THEN 1 ELSE 0 END) as biz_game_cnt,
      SUM(CASE WHEN distribution_type = 0 THEN online_players ELSE 0 END) as biz_online_players,
      SUM(CASE WHEN distribution_type = 1 THEN 1 ELSE 0 END) as mini_game_cnt,
      SUM(CASE WHEN distribution_type = 1 THEN online_players ELSE 0 END) as mini_game_online_players,
      SUM(CASE WHEN distribution_type = 2 THEN 1 ELSE 0 END) as tmk_game_cnt,
      SUM(CASE WHEN distribution_type = 2 THEN online_players ELSE 0 END) as tmk_online_players
    FROM(
      SELECT
        a.crawled_at,
        a.online_players,
        b.distribution_type
      FROM
      (
        SELECT
          app_id,
          online_players,
          crawled_at
        FROM
          taptap_pc_online_players
        WHERE 
          crawled_at = strftime('%Y-%m-%d %H', 'now', 'localtime')
      ) a
      INNER JOIN
      (
        SELECT
          app_id,
          MAX(distribution_type) AS distribution_type
        FROM taptap_game_info_hourly
        WHERE substr(crawled_at, 1, 10) = strftime('%Y-%m-%d', 'now', 'localtime')
        GROUP BY app_id      -- 原表是「小时×app」，不去重会让 join 把在线人数放大 N 倍
      ) b
      ON a.app_id = b.app_id
    ) c
    GROUP BY crawled_at
trigger_type: system
schedule: "25 */2 * * *"
outputs:
  - target_table: "dws_taptap_pc_online_peak_players_v2_hourly"
    table_schema:
      columns:
        - name: id
          type: INTEGER
          constraint: PRIMARY KEY AUTOINCREMENT
        - name: game_cnt
          type: INTEGER
        - name: online_players
          type: INTEGER
        - name: biz_game_cnt
          type: INTEGER
        - name: biz_online_players
          type: INTEGER
        - name: mini_game_cnt
          type: INTEGER
        - name: mini_game_online_players
          type: INTEGER
        - name: tmk_game_cnt
          type: INTEGER
        - name: tmk_online_players
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (strftime('%Y-%m-%d %H', 'now', 'localtime'))
      indexes:
        - name: idx_uk_dws_taptap_pc_online_peak_players_v2_hourly
          columns: [crawled_at]
          unique: true
        - name: idx_qy_dws_taptap_pc_online_peak_players_v2_hourly_1
          columns: [online_players]
        - name: idx_qy_dws_taptap_pc_online_peak_players_v2_hourly_2
          columns: [mini_game_online_players]
        - name: idx_qy_dws_taptap_pc_online_peak_players_v2_hourly_3
          columns: [tmk_online_players]
    parser:
      type: sdk_mapping
      fields:
        - name: game_cnt
          source: game_cnt
          to_number: true
        - name: online_players
          source: online_players
          to_number: true
        - name: biz_game_cnt
          source: biz_game_cnt
          to_number: true
        - name: biz_online_players
          source: biz_online_players
          to_number: true 
        - name: mini_game_cnt
          source: mini_game_cnt
          to_number: true
        - name: mini_game_online_players
          source: mini_game_online_players
          to_number: true 
        - name: tmk_game_cnt
          source: tmk_game_cnt
          to_number: true
        - name: tmk_online_players
          source: tmk_online_players
          to_number: true 
        - name: crawled_at
          source: crawled_at
