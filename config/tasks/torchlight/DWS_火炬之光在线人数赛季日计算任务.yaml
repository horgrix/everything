name: "DWS_火炬之光在线人数赛季日计算任务"
depends_on:
  - "DWS_火炬之光在线人数每天计算任务"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT 
      app_name,
      CASE
        WHEN crawled_at >= '2026-10-16 10' THEN 14
        WHEN crawled_at >= '2026-07-17 10' THEN 13
        WHEN crawled_at >= '2026-04-17 10' THEN 12
        WHEN crawled_at >= '2026-01-16 10' THEN 11
        ELSE 10
      END AS ss,
      CASE
        WHEN crawled_at >= '2026-10-16 10' THEN 91 - (CAST(julianday('2027-01-15 10' || ':00:00') - julianday(crawled_at || ' 00:00:00') AS INTEGER))
        WHEN crawled_at >= '2026-07-17 10' THEN 91 - (CAST(julianday('2026-10-16 10' || ':00:00') - julianday(crawled_at || ' 00:00:00') AS INTEGER))
        WHEN crawled_at >= '2026-04-17 10' THEN 91 - (CAST(julianday('2026-07-17 10' || ':00:00') - julianday(crawled_at || ' 00:00:00') AS INTEGER))
        WHEN crawled_at >= '2026-01-16 10' THEN 91 - (CAST(julianday('2026-04-17 10' || ':00:00') - julianday(crawled_at || ' 00:00:00') AS INTEGER))
        ELSE 0
      END AS ss_day,
      peak_players,
      avg_players,
      steam_peak_players,
      steam_avg_players,
      steam_1974050_peak_players,
      steam_1974050_avg_players,
      steam_2315040_peak_players,
      steam_2315040_avg_players,
      tappc_peak_players,
      tappc_avg_players
    FROM dws_games_torchlight_online_players_daily
trigger_type: system
schedule: "43 * * * *"
outputs:
  - target_table: "dws_games_torchlight_season_online_players"
    table_schema:
      columns:
        - name: id
          type: INTEGER
          constraint: PRIMARY KEY AUTOINCREMENT
        - name: app_name
          type: TEXT
        - name: ss
          type: INTEGER
        - name: ss_day
          type: INTEGER
        - name: peak_players
          type: INTEGER
        - name: avg_players
          type: INTEGER
        - name: steam_peak_players
          type: INTEGER
        - name: steam_avg_players
          type: INTEGER
        - name: steam_1974050_peak_players
          type: INTEGER
        - name: steam_1974050_avg_players
          type: INTEGER
        - name: steam_2315040_peak_players
          type: INTEGER
        - name: steam_2315040_avg_players
          type: INTEGER
        - name: tappc_peak_players
          type: INTEGER
        - name: tappc_avg_players
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (datetime('now', 'localtime'))
      indexes:
        - name: idx_uk_dws_games_torchlight_season_online_players
          columns: [app_name, ss, ss_day]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: app_name
          source: app_name 
        - name: ss
          source: ss
          to_number: true     
        - name: ss_day
          source: ss_day
          to_number: true
        - name: peak_players
          source: peak_players
          to_number: true
        - name: avg_players
          source: avg_players
          to_number: true
        - name: steam_peak_players
          source: steam_peak_players
          to_number: true
        - name: steam_avg_players
          source: steam_avg_players
          to_number: true
        - name: steam_1974050_peak_players
          source: steam_1974050_peak_players
          to_number: true
        - name: steam_1974050_avg_players
          source: steam_1974050_avg_players
          to_number: true
        - name: steam_2315040_peak_players
          source: steam_2315040_peak_players
          to_number: true
        - name: steam_2315040_avg_players
          source: steam_2315040_avg_players
          to_number: true
        - name: tappc_peak_players
          source: tappc_peak_players
          to_number: true
        - name: tappc_avg_players
          source: tappc_avg_players
          to_number: true
