name: "DWS_火炬之光下载数每天计算任务"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT
      crawled_at, 
      app_name,
      SUM(tap_download_count) as tap_download_count,
      SUM(tap_pc_download_count) as tap_pc_download_count,
      SUM(tap_app_download_count) as tap_app_download_count,
      SUM(ios_cn_download_count) as ios_cn_download_count,
      SUM(iphone_cn_download_count) as iphone_cn_download_count,
      SUM(ipad_cn_download_count) as ipad_cn_download_count
    FROM
    (
      SELECT
        crawled_at, 
        '火炬之光：无限' as app_name,
        tap_pc_download_count + tap_app_download_count as tap_download_count,
        tap_pc_download_count,
        tap_app_download_count,
        0 as ios_cn_download_count,
        0 as iphone_cn_download_count,
        0 as ipad_cn_download_count
      FROM(
        SELECT
          substr(crawled_at, 1, 10) as crawled_at, 
          SUM(tap_pc_download_count) as tap_pc_download_count,
          SUM(tap_app_download_count) as tap_app_download_count
        FROM
        (
          SELECT 
            crawled_at,
            pc_download_count - LAG(pc_download_count) OVER (PARTITION BY app_id ORDER BY crawled_at) AS tap_pc_download_count,
            hits_total - LAG(hits_total) OVER (PARTITION BY app_id ORDER BY crawled_at) AS tap_app_download_count
          FROM taptap_pc_hot_list_hourly 
          WHERE app_id = "{torchlight_tap_app_id}"
          AND substr(crawled_at, 1, 10) = strftime('%Y-%m-%d', 'now', 'localtime')
          ORDER BY app_id, crawled_at
        )
        GROUP BY substr(crawled_at, 1, 10)
      )
      UNION ALL
      SELECT
        crawled_at,
        app_name,
        tap_download_count,
        tap_pc_download_count,
        tap_app_download_count,
        ios_cn_download_count,
        iphone_cn_download_count,
        ipad_cn_download_count
      FROM
      (SELECT
        stat_ts as crawled_at,
        app_name,
        0 as tap_download_count,
        0 as tap_pc_download_count,
        0 as tap_app_download_count,
        SUM(download) as ios_cn_download_count,
        SUM(CASE WHEN platform = 'iphone' THEN download ELSE 0 END) as iphone_cn_download_count,
        SUM(CASE WHEN platform = 'ipad' THEN download ELSE 0 END) as ipad_cn_download_count
      FROM ios_xd_games_downlod_daily
      WHERE stat_ts >= "{days_ago:10}"
      GROUP BY stat_ts, app_name)
    )
    GROUP BY crawled_at, app_name
trigger_type: system
schedule: "44 */2 * * *"
outputs:
  - target_table: "dws_games_torchlight_download_daily"
    table_schema:
      columns:
        - name: id
          type: INTEGER
          constraint: PRIMARY KEY AUTOINCREMENT
        - name: app_name
          type: TEXT
        - name: tap_download_count
          type: INTEGER
        - name: tap_pc_download_count
          type: INTEGER
        - name: tap_app_download_count
          type: INTEGER
        - name: ios_cn_download_count
          type: INTEGER
        - name: iphone_cn_download_count
          type: INTEGER
        - name: ipad_cn_download_count
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (strftime('%Y-%m-%d', 'now', 'localtime'))
      indexes:
        - name: idx_uk_dws_games_torchlight_download_daily
          columns: [crawled_at, app_name]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: app_name
          source: app_name
        - name: tap_download_count
          source: tap_download_count
          to_number: true
        - name: tap_pc_download_count
          source: tap_pc_download_count
          to_number: true
        - name: tap_app_download_count
          source: tap_app_download_count
          to_number: true
        - name: ios_cn_download_count
          source: ios_cn_download_count
          to_number: true
        - name: iphone_cn_download_count
          source: iphone_cn_download_count
          to_number: true
        - name: ipad_cn_download_count
          source: ipad_cn_download_count
          to_number: true
        - name: crawled_at
          source: crawled_at
