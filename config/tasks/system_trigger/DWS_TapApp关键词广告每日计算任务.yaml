name: "DWS_TapApp关键词广告每日计算任务"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT 
      crawled_at,
      keyword,
      SUM(total_views) as total_views,
      SUM(CASE WHEN platform = "android" THEN total_views ELSE 0 END) android_views,
      SUM(CASE WHEN platform = "ios" THEN total_views ELSE 0 END) ios_views,
      SUM(CASE WHEN kw_type = "discover" THEN total_views ELSE 0 END) discover_views,
      SUM(CASE WHEN platform = "android" AND kw_type = "discover" THEN total_views ELSE 0 END) android_discover_views,
      SUM(CASE WHEN platform = "ios" AND kw_type = "discover" THEN total_views ELSE 0 END) ios_discover_views,
      SUM(CASE WHEN kw_type = "hot_search" THEN total_views ELSE 0 END) hot_search_views,
      SUM(CASE WHEN platform = "android" AND kw_type = "hot_search" THEN total_views ELSE 0 END) android_hot_search_views,
      SUM(CASE WHEN platform = "ios" AND kw_type = "hot_search" THEN total_views ELSE 0 END) ios_hot_search_views,
      SUM(CASE WHEN kw_type = "hot_spot" THEN total_views ELSE 0 END) hot_spot_views,
      SUM(CASE WHEN platform = "android" AND kw_type = "hot_spot" THEN total_views ELSE 0 END) android_hot_spot_views,
      SUM(CASE WHEN platform = "ios" AND kw_type = "hot_spot" THEN total_views ELSE 0 END) ios_hot_spot_views,
      SUM(ad_views) as ad_views,
      SUM(CASE WHEN platform = "android" THEN ad_views ELSE 0 END) android_ad_views,
      SUM(CASE WHEN platform = "ios" THEN ad_views ELSE 0 END) ios_ad_views,
      SUM(CASE WHEN kw_type = "discover" THEN ad_views ELSE 0 END) discover_ad_views,
      SUM(CASE WHEN platform = "android" AND kw_type = "discover" THEN ad_views ELSE 0 END) android_discover_ad_views,
      SUM(CASE WHEN platform = "ios" AND kw_type = "discover" THEN ad_views ELSE 0 END) ios_discover_ad_views,
      SUM(CASE WHEN kw_type = "hot_search" THEN ad_views ELSE 0 END) hot_search_ad_views,
      SUM(CASE WHEN platform = "android" AND kw_type = "hot_search" THEN ad_views ELSE 0 END) android_hot_search_ad_views,
      SUM(CASE WHEN platform = "ios" AND kw_type = "hot_search" THEN ad_views ELSE 0 END) ios_hot_search_ad_views,
      SUM(CASE WHEN kw_type = "hot_spot" THEN ad_views ELSE 0 END) hot_spot_ad_views,
      SUM(CASE WHEN platform = "android" AND kw_type = "hot_spot" THEN ad_views ELSE 0 END) android_hot_spot_ad_views,
      SUM(CASE WHEN platform = "ios" AND kw_type = "hot_spot" THEN ad_views ELSE 0 END) ios_hot_spot_ad_views
    FROM(
      SELECT 
        "android" as platform,
        "discover" as kw_type,
        keyword,
        COUNT(*) AS total_views,
        SUM(CASE WHEN is_ad = "ad" THEN 1 ELSE 0 END) AS ad_views,
        substr(crawled_at, 1, 10) as crawled_at
      FROM taptap_app_android_search_discovery_ad_hourly
      WHERE substr(crawled_at, 1, 10) >= '{days_ago:4}'
      GROUP BY substr(crawled_at, 1, 10), keyword
      UNION ALL
      SELECT 
        "android" as platform,
        "hot_search" as kw_type,
        keyword,
        COUNT(*) AS total_views,
        SUM(CASE WHEN is_ad = "ad" THEN 1 ELSE 0 END) AS ad_views,
        substr(crawled_at, 1, 10) as crawled_at
      FROM taptap_app_android_search_hot_search_ad_hourly
      WHERE substr(crawled_at, 1, 10) >= '{days_ago:4}'
      GROUP BY substr(crawled_at, 1, 10), keyword
      UNION ALL
      SELECT 
        "android" as platform,
        "hot_spot" as kw_type,
        keyword,
        COUNT(*) AS total_views,
        SUM(CASE WHEN is_ad = "ad" THEN 1 ELSE 0 END) AS ad_views,
        substr(crawled_at, 1, 10) as crawled_at
      FROM taptap_app_android_search_hot_spot_ad_hourly
      WHERE substr(crawled_at, 1, 10) >= '{days_ago:4}'
      GROUP BY substr(crawled_at, 1, 10), keyword
      UNION ALL
      SELECT 
        "ios" as platform,
        "discover" as kw_type,
        keyword,
        COUNT(*) AS total_views,
        SUM(CASE WHEN is_ad = "ad" THEN 1 ELSE 0 END) AS ad_views,
        substr(crawled_at, 1, 10) as crawled_at
      FROM taptap_app_ios_search_discovery_ad_hourly
      WHERE substr(crawled_at, 1, 10) >= '{days_ago:4}'
      GROUP BY substr(crawled_at, 1, 10), keyword
      UNION ALL
      SELECT 
        "ios" as platform,
        "hot_search" as kw_type,
        keyword,
        COUNT(*) AS total_views,
        SUM(CASE WHEN is_ad = "ad" THEN 1 ELSE 0 END) AS ad_views,
        substr(crawled_at, 1, 10) as crawled_at
      FROM taptap_app_ios_search_hot_search_ad_hourly
      WHERE substr(crawled_at, 1, 10) >= '{days_ago:4}'
      GROUP BY substr(crawled_at, 1, 10), keyword
      UNION ALL
      SELECT 
        "ios" as platform,
        "hot_spot" as kw_type,
        keyword,
        COUNT(*) AS total_views,
        SUM(CASE WHEN is_ad = "ad" THEN 1 ELSE 0 END) AS ad_views,
        substr(crawled_at, 1, 10) as crawled_at
      FROM taptap_app_ios_search_hot_spot_ad_hourly
      WHERE substr(crawled_at, 1, 10) >= '{days_ago:4}'
      GROUP BY substr(crawled_at, 1, 10), keyword
    ) a
    GROUP BY crawled_at, keyword
trigger_type: system
schedule: "11 * * * *"
outputs:
  - target_table: "dws_taptap_app_keywords_ad_daily"
    table_schema:
      columns:
        - name: keyword
          type: TEXT
        - name: total_views
          type: INTEGER
        - name: android_views
          type: INTEGER
        - name: ios_views
          type: INTEGER
        - name: discover_views
          type: INTEGER
        - name: android_discover_views
          type: INTEGER
        - name: ios_discover_views
          type: INTEGER
        - name: hot_search_views
          type: INTEGER
        - name: android_hot_search_views
          type: INTEGER
        - name: ios_hot_search_views
          type: INTEGER
        - name: hot_spot_views
          type: INTEGER
        - name: android_hot_spot_views
          type: INTEGER
        - name: ios_hot_spot_views
          type: INTEGER
        - name: ad_views
          type: INTEGER
        - name: android_ad_views
          type: INTEGER
        - name: ios_ad_views
          type: INTEGER
        - name: discover_ad_views
          type: INTEGER
        - name: android_discover_ad_views
          type: INTEGER
        - name: ios_discover_ad_views
          type: INTEGER
        - name: hot_search_ad_views
          type: INTEGER
        - name: android_hot_search_ad_views
          type: INTEGER
        - name: ios_hot_search_ad_views
          type: INTEGER
        - name: hot_spot_ad_views
          type: INTEGER
        - name: android_hot_spot_ad_views
          type: INTEGER
        - name: ios_hot_spot_ad_views
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (strftime('%Y-%m-%d', 'now', 'localtime'))
      indexes:
        - name: idx_uk_dws_taptap_app_keywords_ad_daily_crawled_at_keyword
          columns: [crawled_at, keyword]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: keyword
          source: keyword
        - name: total_views
          source: total_views
          to_number: true
        - name: android_views
          source: android_views
          to_number: true 
        - name: ios_views
          source: ios_views
          to_number: true 
        - name: discover_views
          source: discover_views
          to_number: true
        - name: android_discover_views
          source: android_discover_views
          to_number: true 
        - name: ios_discover_views
          source: ios_discover_views
          to_number: true 
        - name: hot_search_views
          source: hot_search_views
          to_number: true
        - name: android_hot_search_views
          source: android_hot_search_views
          to_number: true 
        - name: ios_hot_search_views
          source: ios_hot_search_views
          to_number: true 
        - name: hot_spot_views
          source: hot_spot_views
          to_number: true
        - name: android_hot_spot_views
          source: android_hot_spot_views
          to_number: true 
        - name: ios_hot_spot_views
          source: ios_hot_spot_views
          to_number: true 
        - name: ad_views
          source: ad_views
          to_number: true 
        - name: android_ad_views
          source: android_ad_views
          to_number: true 
        - name: ios_ad_views
          source: ios_ad_views
          to_number: true 
        - name: discover_ad_views
          source: discover_ad_views
          to_number: true
        - name: android_discover_ad_views
          source: android_discover_ad_views
          to_number: true 
        - name: ios_discover_ad_views
          source: ios_discover_ad_views
          to_number: true 
        - name: hot_search_ad_views
          source: hot_search_ad_views
          to_number: true
        - name: android_hot_search_ad_views
          source: android_hot_search_ad_views
          to_number: true 
        - name: ios_hot_search_ad_views
          source: ios_hot_search_ad_views
          to_number: true 
        - name: hot_spot_ad_views
          source: hot_spot_ad_views
          to_number: true
        - name: android_hot_spot_ad_views
          source: android_hot_spot_ad_views
          to_number: true 
        - name: ios_hot_spot_ad_views
          source: ios_hot_spot_ad_views
          to_number: true 
