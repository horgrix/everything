name: "DWS_TapTap游戏基础信息聚合"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT 
      app_id,
      strftime('%Y-%m-%d %H:%M:%S', 'now', 'localtime') AS crawled_at,
      app_name, distribution_type, tag_1, tag_2, tag_3, MAX(icon) as icon 
    FROM
      (
        SELECT 
          app_id,
          distribution_type,
          app_name,
          tag_1,
          tag_2,
          tag_3,
          icon
        FROM taptap_pc_hot_list_hourly 
        WHERE crawled_at = strftime('%Y-%m-%d %H', 'now', 'localtime')
        UNION ALL
        SELECT 
          app_id,
          distribution_type,
          app_name,
          tag_1,
          tag_2,
          tag_3,
          icon
        FROM taptap_app_hot_list_hourly
        WHERE crawled_at = strftime('%Y-%m-%d %H', 'now', 'localtime')
        UNION ALL
        SELECT 
          app_id,
          distribution_type,
          app_name,
          tag_1,
          tag_2,
          tag_3,
          icon
        FROM taptap_app_android_landing_ad_hourly
        WHERE crawled_at = strftime('%Y-%m-%d %H', 'now', 'localtime')
        UNION ALL
        SELECT 
          app_id,
          distribution_type,
          app_name,
          tag_1,
          tag_2,
          tag_3,
          icon
        FROM taptap_app_ios_landing_ad_hourly
        WHERE crawled_at = strftime('%Y-%m-%d %H', 'now', 'localtime')
        UNION ALL
        SELECT 
          app_id,
          distribution_type,
          app_name,
          tag_1,
          tag_2,
          tag_3,
          icon
        FROM taptap_pc_ad_discovery_hourly
        WHERE crawled_at = strftime('%Y-%m-%d %H', 'now', 'localtime')
        UNION ALL
        SELECT 
          app_id,
          distribution_type,
          app_name,
          tag_1,
          tag_2,
          tag_3,
          icon
        FROM taptap_pc_ad_top_hourly
        WHERE crawled_at = strftime('%Y-%m-%d %H', 'now', 'localtime')
        UNION ALL
        SELECT 
          app_id,
          distribution_type,
          app_name,
          tag_1,
          tag_2,
          tag_3,
          icon
        FROM taptap_keywords_list_hourly
        WHERE crawled_at = strftime('%Y-%m-%d %H', 'now', 'localtime')
      )
      GROUP BY app_id, app_name, distribution_type, tag_1, tag_2, tag_3
trigger_type: system
schedule: "15 * * * *"
outputs:
  - target_table: "dws_taptap_game"
    table_schema:
      columns:
        - name: id
          type: INTEGER
          constraint: PRIMARY KEY AUTOINCREMENT
        - name: app_id
          type: INTEGER
        - name: app_name
          type: TEXT
        - name: distribution_type
          type: INTEGER
        - name: tag_1
          type: TEXT
        - name: tag_2
          type: TEXT
        - name: tag_3
          type: TEXT
        - name: icon
          type: TEXT
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (strftime('%Y-%m-%d %H:%M:%S', 'now', 'localtime'))
      indexes:
        - name: idx_uk_dws_taptap_game_app_id_crawled_at
          columns: [app_id]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: app_id
          source: app_id
          to_number: true      
        - name: app_name
          source: app_name
        - name: distribution_type
          source: distribution_type
          to_number: true
        - name: tag_1
          source: tag_1
        - name: tag_2
          source: tag_2
        - name: tag_3
          source: tag_3
        - name: icon
          source: icon
        - name: crawled_at
          source: crawled_at
