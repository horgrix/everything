name: "DWS_下载数Tap渠道每天计算任务"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT
      substr(crawled_at, 1, 10) as crawled_at, 
      CASE WHEN app_id = 172664 THEN '火炬之光：无限' ELSE '心动小镇' END as app_name,
      SUM(tap_pc_download_count + tap_app_download_count) as tap_download_count,
      SUM(tap_pc_download_count) as tap_pc_download_count,
      SUM(tap_app_download_count) as tap_app_download_count
    FROM
    (
      SELECT 
        crawled_at,
        app_id,
        pc_download_count - LAG(pc_download_count) OVER (PARTITION BY app_id ORDER BY crawled_at) AS tap_pc_download_count,
        hits_total - LAG(hits_total) OVER (PARTITION BY app_id ORDER BY crawled_at) AS tap_app_download_count
      FROM taptap_pc_hot_list_hourly 
      WHERE app_id in (172664, 45213)
      AND crawled_at >= substr(datetime('now', 'localtime', '-36 hour'), 1, 13)
      ORDER BY app_id, crawled_at
    )
    WHERE substr(crawled_at, 1, 10) = "{today}"
    GROUP BY substr(crawled_at, 1, 10), app_id
trigger_type: system
schedule: "44 */2 * * *"
outputs:
  - target_table: "dws_xd_games_tap_download_daily"
    table_schema:
      columns:
        - name: id
          type: INTEGER
          constraint: PRIMARY KEY AUTOINCREMENT
        - name: app_name
          type: TEXT
        - name: tap_download_count
          type: INTEGER
        - name: tap_pc_download_count
          type: INTEGER
        - name: tap_app_download_count
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (strftime('%Y-%m-%d', 'now', 'localtime'))
      indexes:
        - name: idx_uk_dws_xd_games_tap_download_daily
          columns: [crawled_at, app_name]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: app_name
          source: app_name
        - name: tap_download_count
          source: tap_download_count
          to_number: true
        - name: tap_pc_download_count
          source: tap_pc_download_count
          to_number: true
        - name: tap_app_download_count
          source: tap_app_download_count
          to_number: true
        - name: crawled_at
          source: crawled_at
