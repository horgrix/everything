name: "DWS_下载数全渠道聚合任务"
depends_on:
  - "DWS_下载数iOS渠道每天计算任务"
  - "DWS_下载数Tap渠道每天计算任务"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT 
      a.crawled_at,
      a.app_name,
      a.tap_download_count,
      a.tap_pc_download_count,
      a.tap_app_download_count,
      b.ios_cn_download_count,
      b.iphone_cn_download_count,
      b.ipad_cn_download_count
    FROM 
      dws_xd_games_tap_download_daily a
    INNER JOIN
      dws_xd_games_ios_download_daily b
    ON 
      a.crawled_at = b.crawled_at
    AND 
      a.app_name = b.app_name
    WHERE a.crawled_at >= "{days_ago:91}"
trigger_type: system
schedule: "45 8 * * *"
outputs:
  - target_table: "dws_xd_games_all_download_daily"
    table_schema:
      columns:
        - name: id
          type: INTEGER
          constraint: PRIMARY KEY AUTOINCREMENT
        - name: app_name
          type: TEXT
        - name: tap_download_count
          type: INTEGER
        - name: tap_pc_download_count
          type: INTEGER
        - name: tap_app_download_count
          type: INTEGER
        - name: ios_cn_download_count
          type: INTEGER
        - name: iphone_cn_download_count
          type: INTEGER
        - name: ipad_cn_download_count
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (datetime('now', 'localtime'))
      indexes:
        - name: idx_uk_dws_xd_games_all_download_daily
          columns: [app_name, crawled_at]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: app_name
          source: app_name 
        - name: tap_download_count
          source: tap_download_count
          to_number: true
        - name: tap_pc_download_count
          source: tap_pc_download_count
          to_number: true
        - name: tap_app_download_count
          source: tap_app_download_count
          to_number: true
        - name: ios_cn_download_count
          source: ios_cn_download_count
          to_number: true
        - name: iphone_cn_download_count
          source: iphone_cn_download_count
          to_number: true
        - name: ipad_cn_download_count
          source: ipad_cn_download_count
          to_number: true
        - name: crawled_at
          source: crawled_at  