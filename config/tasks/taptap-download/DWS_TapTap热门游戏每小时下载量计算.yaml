name: "DWS_TapTap热门游戏每小时下载量计算"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT
      *
    FROM
    (
      SELECT 
        app_id,
        app_name,
        crawled_at,
        distribution_type,
        icon,
        refer,
        total_download_count,
        total_download_count -  CASE 
                                  WHEN total_download_count_lag > 0 THEN total_download_count_lag
                                  WHEN total_download_count_lag = 0 AND strftime('%Y-%m-%d', released_time, 'unixepoch', 'localtime') = strftime('%Y-%m-%d', 'now', 'localtime') THEN 0 
                                  ELSE total_download_count 
                                END AS download_count
      FROM
      (
        SELECT 
          app_id,
          app_name,
          crawled_at,
          distribution_type,
          icon,
          released_time,
          'pc' as refer,
          pc_download_count as total_download_count,
          LAG(pc_download_count, 1, 0) OVER (PARTITION BY app_id ORDER BY crawled_at) as total_download_count_lag
        FROM taptap_pc_hot_list_hourly 
        WHERE app_id IS NOT NULL
        AND crawled_at >= substr(datetime('now', 'localtime', '-36 hour'), 1, 13)
      ) as t1
    )
    WHERE download_count >= 0 AND crawled_at = strftime('%Y-%m-%d %H', 'now', 'localtime')
    UNION ALL
    SELECT
      *
    FROM
    (
      SELECT 
        app_id,
        app_name,
        crawled_at,
        distribution_type,
        icon,
        refer,
        total_download_count,
        total_download_count -  CASE 
                                  WHEN total_download_count_lag > 0 THEN total_download_count_lag
                                  WHEN total_download_count_lag = 0 AND strftime('%Y-%m-%d', released_time, 'unixepoch', 'localtime') = strftime('%Y-%m-%d', 'now', 'localtime') THEN 0 
                                  ELSE total_download_count 
                                END AS download_count
      FROM
      (
        SELECT 
          app_id,
          app_name,
          crawled_at,
          distribution_type,
          icon,
          released_time,
          'app' as refer,
          hits_total as total_download_count,
          LAG(hits_total, 1, 0) OVER (PARTITION BY app_id ORDER BY crawled_at) AS total_download_count_lag
        FROM taptap_app_hot_list_hourly
        WHERE app_id IS NOT NULL
        AND crawled_at >= substr(datetime('now', 'localtime', '-36 hour'), 1, 13)
        ORDER BY app_id, crawled_at DESC
      ) as t2
    )
    WHERE download_count >= 0 AND crawled_at = strftime('%Y-%m-%d %H', 'now', 'localtime')
trigger_type: system
schedule: "5 */2 * * *"
outputs:
  - target_table: "dws_taptap_download_hourly"
    table_schema:
      columns:
        - name: id
          type: INTEGER
          constraint: PRIMARY KEY AUTOINCREMENT
        - name: app_id
          type: INTEGER
        - name: app_name
          type: TEXT
        - name: distribution_type
          type: INTEGER
        - name: icon
          type: TEXT
        - name: refer
          type: TEXT
        - name: total_download_count
          type: INTEGER
        - name: download_count
          type: INTEGER
        - name: crawled_at
          type: TEXT
      indexes:
        - name: idx_uk_crawled_at_refer_distribution_type_app_id
          columns: [crawled_at, refer, distribution_type, app_id]
          unique: true
        - name: idx_qy_crawled_at_app_id
          columns: [crawled_at, app_id]
        - name: idx_qy_crawled_at_refer_app_id
          columns: [crawled_at, refer, app_id]
        - name: idx_qy_crawled_at_distribution_type_app_id
          columns: [crawled_at, distribution_type, app_id]
    parser:
      type: sdk_mapping
      fields:
        - name: app_id
          source: app_id
          to_number: true   
        - name: app_name
          source: app_name 
        - name: distribution_type
          source: distribution_type
          to_number: true
        - name: icon
          source: icon     
        - name: refer
          source: refer
        - name: total_download_count
          source: total_download_count
          to_number: true
        - name: download_count
          source: download_count
          to_number: true
        - name: crawled_at
          source: crawled_at
