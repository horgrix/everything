name: "DWS_TapPC首页广告每日计算任务"
depends_on:
  - "DWS_TapTap游戏基础信息采集任务"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT
      b.crawled_at AS crawled_at,
      b.app_id AS app_id, 
      c.app_name AS app_name,
      c.tag_1 AS tag_1,
      c.tag_2 AS tag_2,
      c.tag_3 AS tag_3,
      c.distribution_type AS distribution_type,
      b.total_views,
      b.top_views,
      b.discovery_views,
      b.ad_views,
      b.top_ad_views,
      b.discovery_ad_views,
      b.top_focus_views
    FROM(
      SELECT 
        crawled_at,
        app_id,
        SUM(total_views) as total_views,
        SUM(CASE WHEN src = 'top' THEN total_views ELSE 0 END) top_views,
        SUM(CASE WHEN src = 'dcy' THEN total_views ELSE 0 END) discovery_views,
        SUM(ad_views) as ad_views,
        SUM(CASE WHEN src = 'top' THEN ad_views ELSE 0 END) top_ad_views,
        SUM(CASE WHEN src = 'dcy' THEN ad_views ELSE 0 END) discovery_ad_views,
        SUM(CASE WHEN src = 'top' THEN focus_views ELSE 0 END) top_focus_views
      FROM
      (
        SELECT 
          'top' as src,
          app_id,
          COUNT(*) AS total_views,
          SUM(CASE WHEN is_ad = 'True' THEN 1 ELSE 0 END) AS ad_views,
          SUM(CASE WHEN is_editor_rec = 'False' THEN 1 ELSE 0 END) AS focus_views,
          substr(crawled_at, 1, 10) as crawled_at
        FROM taptap_pc_ad_top_hourly
        WHERE substr(crawled_at, 1, 10) = '{today}'
        GROUP BY substr(crawled_at, 1, 10), app_id
        UNION ALL
        SELECT 
          'dcy' as src,
          app_id,
          COUNT(*) AS total_views,
          SUM(CASE WHEN is_ad = 'True' THEN 1 ELSE 0 END) AS ad_views,
          0 AS focus_views,
          substr(crawled_at, 1, 10) as crawled_at
        FROM taptap_pc_ad_discovery_hourly
        WHERE substr(crawled_at, 1, 10) = '{today}'
        GROUP BY substr(crawled_at, 1, 10), app_id
      ) a
      GROUP BY crawled_at, app_id
    ) b
    LEFT JOIN
      (
        SELECT 
          distribution_type,
          tag_1,
          tag_2,
          tag_3,
          app_name,
          app_id
        FROM dws_taptap_game_basic_info_monthly
        WHERE crawled_at = strftime('%Y-%m', 'now', 'localtime')
      ) c
    ON 
      b.app_id = c.app_id
trigger_type: system
schedule: "23 * * * *"
outputs:
  - target_table: "dws_taptap_pc_ad_landing_daily"
    table_schema:
      columns:
        - name: app_id
          type: INTEGER
        - name: app_name
          type: TEXT
        - name: tag_1
          type: TEXT
        - name: tag_2
          type: TEXT
        - name: tag_3
          type: TEXT
        - name: distribution_type
          type: INTEGER
        - name: total_views
          type: INTEGER
        - name: top_views
          type: INTEGER
        - name: discovery_views
          type: INTEGER
        - name: ad_views
          type: INTEGER
        - name: top_ad_views
          type: INTEGER
        - name: discovery_ad_views
          type: INTEGER
        - name: top_focus_views
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (strftime('%Y-%m-%d', 'now', 'localtime'))
      indexes:
        - name: idx_uk_dws_taptap_pc_ad_landing_daily
          columns: [crawled_at, app_id]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: app_id
          source: app_id
          to_number: true 
        - name: app_name
          source: app_name
        - name: tag_1
          source: tag_1     
        - name: tag_2
          source: tag_2
        - name: tag_3
          source: tag_3
        - name: distribution_type
          source: distribution_type
          to_number: true   
        - name: total_views
          source: total_views
          to_number: true
        - name: top_views
          source: top_views
          to_number: true 
        - name: discovery_views
          source: discovery_views
          to_number: true   
        - name: ad_views
          source: ad_views
          to_number: true 
        - name: top_ad_views
          source: top_ad_views
          to_number: true 
        - name: discovery_ad_views
          source: discovery_ad_views
          to_number: true      
        - name: top_focus_views
          source: top_focus_views
          to_number: true 
        - name: crawled_at
          source: crawled_at
