name: "DWS_TapPC首页广告每日计算任务"
depends_on:
  - "DWS_TapTap游戏基础信息聚合"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT
      b.crawled_at AS crawled_at,
      b.app_id AS app_id, 
      b.ad_views,
      b.top_ad_views,
      b.discovery_ad_views
    FROM(
      SELECT 
        crawled_at,
        app_id,
        SUM(ad_views) as ad_views,
        SUM(CASE WHEN src = 'top' THEN ad_views ELSE 0 END) top_ad_views,
        SUM(CASE WHEN src = 'dcy' THEN ad_views ELSE 0 END) discovery_ad_views
      FROM
      (
        SELECT 
          'top' as src,
          app_id,
          SUM(CASE WHEN is_ad = 'True' THEN 1 ELSE 0 END) AS ad_views,
          substr(crawled_at, 1, 10) as crawled_at
        FROM taptap_pc_ad_top_hourly
        WHERE substr(crawled_at, 1, 10) >= '{days_ago:7}'
        AND is_ad = 'True'
        GROUP BY substr(crawled_at, 1, 10), app_id
        UNION ALL
        SELECT 
          'dcy' as src,
          app_id,
          SUM(CASE WHEN is_ad = 'True' THEN 1 ELSE 0 END) AS ad_views,
          substr(crawled_at, 1, 10) as crawled_at
        FROM taptap_pc_ad_discovery_hourly
        WHERE substr(crawled_at, 1, 10) >= '{days_ago:7}'
        AND is_ad = 'True'
        GROUP BY substr(crawled_at, 1, 10), app_id
      ) a
      GROUP BY crawled_at, app_id
    ) b
trigger_type: system
schedule: "21 * * * *"
outputs:
  - target_table: "dws_taptap_ad_landing_pc_v4_daily"
    table_schema:
      columns:
        - name: id
          type: INTEGER
          constraint: PRIMARY KEY AUTOINCREMENT
        - name: app_id
          type: INTEGER
        - name: ad_views
          type: INTEGER
        - name: top_ad_views
          type: INTEGER
        - name: discovery_ad_views
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (strftime('%Y-%m-%d', 'now', 'localtime'))
      indexes:
        - name: idx_uk_dws_taptap_ad_landing_pc_v4_daily
          columns: [crawled_at, app_id]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: app_id
          source: app_id
          to_number: true  
        - name: ad_views
          source: ad_views
          to_number: true 
        - name: top_ad_views
          source: top_ad_views
          to_number: true 
        - name: discovery_ad_views
          source: discovery_ad_views
          to_number: true      
        - name: crawled_at
          source: crawled_at
