name: "DWS_Tap广告每日聚合任务"
depends_on:
  - "DWS_TapApp关键词广告每日计算任务"
  - "DWS_TapApp首页广告每日计算任务"
  - "DWS_TapPC首页广告每日计算任务"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT
      *
    FROM
    (
      SELECT
        a.crawled_at AS crawled_at,
        a.app_id AS app_id, 
        a.app_name AS app_name,
        b.tag_1 AS tag_1,
        b.tag_2 AS tag_2,
        b.tag_3 AS tag_3,
        b.distribution_type AS distribution_type,
        total_views,
        app_views,
        pc_views,
        kw_views,
        ad_views,
        app_ad_views,
        pc_ad_views,
        kw_ad_views,
        pcebid_views,
        app_pcebid_views,
        pc_pcebid_views,
        kw_pcebid_views
      FROM
      (
        SELECT
          crawled_at, 
          app_id,
          app_name,
          SUM(total_views) AS total_views,
          SUM(CASE WHEN src = 'app' THEN total_views ELSE 0 END) AS app_views,
          SUM(CASE WHEN src = 'pc' THEN total_views ELSE 0 END) AS pc_views,
          SUM(CASE WHEN src = 'kw' THEN total_views ELSE 0 END) AS kw_views,
          SUM(ad_views) AS ad_views,
          SUM(CASE WHEN src = 'app' THEN ad_views ELSE 0 END) AS app_ad_views,
          SUM(CASE WHEN src = 'pc' THEN ad_views ELSE 0 END) AS pc_ad_views,
          SUM(CASE WHEN src = 'kw' THEN ad_views ELSE 0 END) AS kw_ad_views,
          SUM(pcebid_views) AS pcebid_views,
          SUM(CASE WHEN src = 'app' THEN pcebid_views ELSE 0 END) AS app_pcebid_views,
          SUM(CASE WHEN src = 'pc' THEN pcebid_views ELSE 0 END) AS pc_pcebid_views,
          SUM(CASE WHEN src = 'kw' THEN pcebid_views ELSE 0 END) AS kw_pcebid_views
        FROM
        (
          SELECT
            'app' AS src,
            app_name,
            crawled_at AS crawled_at,
            app_id AS app_id, 
            total_views,
            ad_views,
            pcebid_views
          FROM dws_taptap_app_landing_ad_daily
          WHERE crawled_at >= '{days_ago:15}'
          UNION ALL 
          SELECT
            'pc' AS src,
            app_name,
            crawled_at AS crawled_at,
            app_id AS app_id, 
            total_views,
            ad_views,
            0 as pcebid_views
          FROM dws_taptap_pc_ad_landing_daily
          WHERE crawled_at >= '{days_ago:15}'
          UNION ALL
          SELECT
            'kw' AS src,
            keyword as app_name,
            crawled_at AS crawled_at,
            app_id AS app_id, 
            total_views,
            ad_views,
            0 as pcebid_views
          FROM dws_taptap_app_keywords_ad_v2_daily
          WHERE crawled_at >= '{days_ago:15}'
        )
        GROUP BY crawled_at, app_id, app_name
      ) a
      LEFT JOIN
        (
          SELECT 
            distribution_type,
            tag_1,
            tag_2,
            tag_3,
            app_name,
            app_id
          FROM dws_taptap_game
          WHERE crawled_at = strftime('%Y-%m', 'now', 'localtime')
        ) b
      ON 
        a.app_id = b.app_id
    )
    WHERE ad_views > 0
trigger_type: system
schedule: "26 * * * *"
outputs:
  - target_table: "dws_taptap_ad_aggr_v2_daily"
    table_schema:
      columns:
        - name: app_id
          type: INTEGER
        - name: app_name
          type: TEXT
        - name: tag_1
          type: TEXT
        - name: tag_2
          type: TEXT
        - name: tag_3
          type: TEXT
        - name: distribution_type
          type: INTEGER
        - name: total_views
          type: INTEGER
        - name: app_views
          type: INTEGER
        - name: pc_views
          type: INTEGER
        - name: kw_views
          type: INTEGER
        - name: ad_views
          type: INTEGER
        - name: app_ad_views
          type: INTEGER
        - name: pc_ad_views
          type: INTEGER
        - name: kw_ad_views
          type: INTEGER
        - name: pcebid_views
          type: INTEGER
        - name: app_pcebid_views
          type: INTEGER
        - name: pc_pcebid_views
          type: INTEGER
        - name: kw_pcebid_views
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (strftime('%Y-%m-%d', 'now', 'localtime'))
      indexes:
        - name: idx_uk_dws_taptap_ad_aggr_v2_daily
          columns: [crawled_at, app_id]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: app_id
          source: app_id
          to_number: true 
        - name: app_name
          source: app_name
        - name: tag_1
          source: tag_1     
        - name: tag_2
          source: tag_2
        - name: tag_3
          source: tag_3
        - name: distribution_type
          source: distribution_type
          to_number: true
        - name: total_views
          source: total_views
          to_number: true
        - name: app_views
          source: app_views
          to_number: true 
        - name: pc_views
          source: pc_views
          to_number: true   
        - name: kw_views
          source: kw_views
          to_number: true    
        - name: ad_views
          source: ad_views
          to_number: true 
        - name: app_ad_views
          source: app_ad_views
          to_number: true      
        - name: pc_ad_views
          source: pc_ad_views
          to_number: true 
        - name: kw_ad_views
          source: kw_ad_views
          to_number: true 
        - name: pcebid_views
          source: pcebid_views
          to_number: true 
        - name: app_pcebid_views
          source: app_pcebid_views
          to_number: true 
        - name: pc_pcebid_views
          source: pc_pcebid_views
          to_number: true 
        - name: kw_pcebid_views
          source: kw_pcebid_views
          to_number: true 
        - name: crawled_at
          source: crawled_at
