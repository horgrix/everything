name: "DWS_Tap广告每日汇总任务"
depends_on:
  - "DWS_Tap广告每日聚合任务"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT
      crawled_at AS crawled_at,
      SUM(ad_views) AS ad_views,
      SUM(app_ad_views) AS app_ad_views,
      SUM(pc_ad_views) AS pc_ad_views,
      SUM(kw_ad_views) AS kw_ad_views,
      SUM(pcebid_views) AS pcebid_views,
      SUM(app_pcebid_views) AS app_pcebid_views,
      SUM(pc_pcebid_views) AS pc_pcebid_views,
      SUM(kw_pcebid_views) AS kw_pcebid_views
    FROM
      dws_taptap_ad_aggr_v5_daily
    WHERE 
      crawled_at >= '{days_ago:7}'
    GROUP BY
      crawled_at
trigger_type: system
schedule: "29 * * * *"
outputs:
  - target_table: "dws_taptap_ad_overview_v5_daily"
    table_schema:
      columns:
        - name: id
          type: INTEGER
          constraint: PRIMARY KEY AUTOINCREMENT
        - name: ad_views
          type: INTEGER
        - name: app_ad_views
          type: INTEGER
        - name: pc_ad_views
          type: INTEGER
        - name: kw_ad_views
          type: INTEGER
        - name: pcebid_views
          type: INTEGER
        - name: app_pcebid_views
          type: INTEGER
        - name: pc_pcebid_views
          type: INTEGER
        - name: kw_pcebid_views
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (strftime('%Y-%m-%d', 'now', 'localtime'))
      indexes:
        - name: idx_uk_dws_taptap_ad_overview_v5_daily
          columns: [crawled_at]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: ad_views
          source: ad_views
          to_number: true 
        - name: app_ad_views
          source: app_ad_views
          to_number: true      
        - name: pc_ad_views
          source: pc_ad_views
          to_number: true 
        - name: kw_ad_views
          source: kw_ad_views
          to_number: true 
        - name: pcebid_views
          source: pcebid_views
          to_number: true 
        - name: app_pcebid_views
          source: app_pcebid_views
          to_number: true 
        - name: pc_pcebid_views
          source: pc_pcebid_views
          to_number: true 
        - name: kw_pcebid_views
          source: kw_pcebid_views
          to_number: true 
        - name: crawled_at
          source: crawled_at
