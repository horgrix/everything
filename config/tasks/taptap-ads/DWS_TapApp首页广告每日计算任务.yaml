name: "DWS_TapApp首页广告每日计算任务"
depends_on:
  - "DWS_TapTap游戏基础信息聚合"
type: db
db:
  type: sqlite
  path: "crawler.db"
  query: >
    SELECT
      b.crawled_at AS crawled_at,
      b.app_id AS app_id, 
      b.ad_views,
      b.android_ad_views,
      b.ios_ad_views,
      b.pcebid_views,
      b.android_pcebid_views,
      b.ios_pcebid_views
    FROM
    (
      SELECT 
        crawled_at,
        app_id,
        SUM(ad_views) as ad_views,
        SUM(CASE WHEN platform = 'android' THEN ad_views ELSE 0 END) android_ad_views,
        SUM(CASE WHEN platform = 'ios' THEN ad_views ELSE 0 END) ios_ad_views,
        SUM(pcebid_views) as pcebid_views,
        SUM(CASE WHEN platform = 'android' THEN pcebid_views ELSE 0 END) android_pcebid_views,
        SUM(CASE WHEN platform = 'ios' THEN pcebid_views ELSE 0 END) ios_pcebid_views
      FROM(
        SELECT 
          'android' as platform,
          app_id,
          SUM(CASE WHEN is_ad = 'True' THEN 1 ELSE 0 END) AS ad_views,
          SUM(CASE WHEN pcebid = 'pcebid' THEN 1 ELSE 0 END) AS pcebid_views,
          substr(crawled_at, 1, 10) as crawled_at
        FROM taptap_app_android_landing_ad_hourly
        WHERE substr(crawled_at, 1, 10) >= '{days_ago:15}'
        AND position <= 10
        AND (is_ad = 'True' OR pcebid = 'pcebid')
        GROUP BY substr(crawled_at, 1, 10), app_id
        UNION ALL
        SELECT 
          'ios' as platform,
          app_id,
          SUM(CASE WHEN is_ad = 'True' THEN 1 ELSE 0 END) AS ad_views,
          SUM(CASE WHEN pcebid = 'pcebid' THEN 1 ELSE 0 END) AS pcebid_views,
          substr(crawled_at, 1, 10) as crawled_at
        FROM taptap_app_ios_landing_ad_hourly
        WHERE substr(crawled_at, 1, 10) >= '{days_ago:15}'
        AND position <= 10
        AND (is_ad = 'True' OR pcebid = 'pcebid')
        GROUP BY substr(crawled_at, 1, 10), app_id) a
      GROUP BY crawled_at, app_id
    ) b
trigger_type: system
schedule: "23 * * * *"
outputs:
  - target_table: "dws_taptap_ad_landing_app_v4_daily"
    table_schema:
      columns:
        - name: id
          type: INTEGER
          constraint: PRIMARY KEY AUTOINCREMENT
        - name: app_id
          type: INTEGER
        - name: ad_views
          type: INTEGER
        - name: android_ad_views
          type: INTEGER
        - name: ios_ad_views
          type: INTEGER
        - name: pcebid_views
          type: INTEGER
        - name: android_pcebid_views
          type: INTEGER
        - name: ios_pcebid_views
          type: INTEGER
        - name: crawled_at
          type: TEXT NOT NULL DEFAULT (strftime('%Y-%m-%d', 'now', 'localtime'))
      indexes:
        - name: idx_uk_dws_taptap_ad_landing_app_v4_daily
          columns: [crawled_at, app_id]
          unique: true
    parser:
      type: sdk_mapping
      fields:
        - name: app_id
          source: app_id
          to_number: true 
        - name: ad_views
          source: ad_views
          to_number: true 
        - name: android_ad_views
          source: android_ad_views
          to_number: true 
        - name: ios_ad_views
          source: ios_ad_views
          to_number: true      
        - name: pcebid_views
          source: pcebid_views
          to_number: true 
        - name: android_pcebid_views
          source: android_pcebid_views
          to_number: true 
        - name: ios_pcebid_views
          source: ios_pcebid_views
          to_number: true  
        - name: crawled_at
          source: crawled_at
